# Atualiza os benchmarks do mês fechado anterior.
# Salvar como: .github/workflows/mensal.yml
name: Atualizar benchmarks

on:
  schedule:
    - cron: "0 12 12 * *"   # todo dia 12, meio-dia UTC (IPCA já saiu, IHFA já fechou)
  workflow_dispatch:         # permite rodar na mão pelo botão "Run workflow"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # O "tee" guarda a saída de cada busca para ela aparecer na primeira tela
      # do run, em vez de ficar enterrada no log. O "set -o pipefail" mantém o
      # código de saída do node: sem ele o código seria o do tee, e os avisos
      # nunca disparariam.

      # Banco Central: CDI, IPCA e dólar PTAX. Público, sem chave.
      - name: Buscar no Banco Central
        id: bcb
        continue-on-error: true      # código 2 = gravou com NÃO OBTIDO; ainda assim comita
        run: |
          set -o pipefail
          node scripts/buscar-benchmarks.js 2>&1 | tee bcb.log

      # ANBIMA: IRF-M, IMA-B e IHFA. Usa as credenciais guardadas em Secrets.
      - name: Buscar na ANBIMA
        id: anbima
        continue-on-error: true
        env:
          ANBIMA_CLIENT_ID:     ${{ secrets.ANBIMA_CLIENT_ID }}
          ANBIMA_CLIENT_SECRET: ${{ secrets.ANBIMA_CLIENT_SECRET }}
        run: |
          set -o pipefail
          node scripts/buscar-anbima.js 2>&1 | tee anbima.log

      # Yahoo Finance: Ibovespa e BITH11. Público, sem chave.
      - name: Buscar no mercado
        id: mercado
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/buscar-mercado.js 2>&1 | tee mercado.log

      - name: Commitar se mudou
        id: commit
        continue-on-error: true
        run: |
          ARQ=$(git ls-files '*benchmarks.json' | head -1)
          if [ -z "$ARQ" ]; then
            echo "Não achei nenhum benchmarks.json versionado no repositório." | tee commit.log
            exit 1
          fi
          echo "Arquivo: $ARQ" | tee commit.log
          if git diff --quiet -- "$ARQ"; then
            echo "Nada mudou — não há o que comitar." | tee -a commit.log
            exit 0
          fi
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add "$ARQ"
          git commit -m "benchmarks: $(date -u +%Y-%m)"
          git push
          echo "Comitado e publicado." | tee -a commit.log

      # Põe tudo na primeira tela do run, para não precisar cavar o log.
      - name: Mostrar o resultado no resumo
        if: always()
        run: |
          {
            echo "# Resultado"
            echo
            echo "| Fonte | Como terminou |"
            echo "|---|---|"
            echo "| Banco Central | ${{ steps.bcb.outcome }} |"
            echo "| ANBIMA | ${{ steps.anbima.outcome }} |"
            echo "| Mercado | ${{ steps.mercado.outcome }} |"
            echo "| Commit | ${{ steps.commit.outcome }} |"
            echo
            for par in "ANBIMA:anbima.log" "Banco Central:bcb.log" "Mercado:mercado.log" "Commit:commit.log"; do
              nome="${par%%:*}"; arq="${par#*:}"
              echo "## $nome"
              echo '```'
              if [ -f "$arq" ]; then cat "$arq"; else echo "(o passo não chegou a rodar)"; fi
              echo '```'
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Avisar se algum índice ficou sem dado
        if: steps.bcb.outcome != 'success' || steps.anbima.outcome != 'success' || steps.mercado.outcome != 'success'
        run: |
          echo "::warning::Algum índice ficou como NÃO OBTIDO. O motivo está no resumo deste run, logo acima."
