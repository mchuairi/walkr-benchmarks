# Atualiza os benchmarks do mês fechado anterior.
# Salvar como: .github/workflows/mensal.yml
#
# Fonte única: Mais Retorno. Substituiu as três de antes (Banco Central, ANBIMA
# e Yahoo), que davam três pontos de falha e ainda deixavam o IFIX manual.
name: Atualizar benchmarks

on:
  schedule:
    - cron: "0 12 12 * *"   # todo dia 12, meio-dia UTC (o mês anterior já fechou em todas as fontes)
  workflow_dispatch:
    inputs:
      mes:
        description: "Mês a buscar (AAAA-MM). Vazio = o mês que acabou de fechar."
        required: false
        default: ""
      descobrir:
        description: "Só conferir se os índices existem, sem gastar crédito"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    # A calculadora lê o benchmarks.json que está NA PASTA DELA. Os scripts
    # antigos gravavam na raiz do repositório, num arquivo que o site nunca abre.
    env:
      BENCHMARKS: carteira/benchmarks.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # O "tee" guarda a saída para ela aparecer na primeira tela do run, em vez
      # de ficar enterrada no log. O "set -o pipefail" mantém o código de saída
      # do node: sem ele o código seria o do tee e os avisos nunca disparariam.
      - name: Buscar os índices
        id: busca
        continue-on-error: true      # código 2 = algum índice faltou; ainda assim comita o resto
        env:
          MAISRETORNO_API_KEY: ${{ secrets.MAISRETORNO_API_KEY }}
        run: |
          set -o pipefail
          ARGS=""
          if [ "${{ inputs.descobrir }}" = "true" ]; then ARGS="--descobrir"; fi
          if [ -n "${{ inputs.mes }}" ]; then ARGS="$ARGS ${{ inputs.mes }}"; fi
          node scripts/buscar-indices.js $ARGS 2>&1 | tee busca.log

      - name: Commitar se mudou
        id: commit
        if: inputs.descobrir != true
        continue-on-error: true
        run: |
          ARQ="$BENCHMARKS"
          if [ ! -f "$ARQ" ]; then
            echo "Não achei $ARQ. Confira o caminho em env: BENCHMARKS, no topo deste arquivo." | tee commit.log
            git ls-files '*benchmarks.json' | sed 's/^/  existe no repo: /' | tee -a commit.log
            exit 1
          fi
          echo "Arquivo: $ARQ" | tee commit.log
          if git diff --quiet -- "$ARQ"; then
            echo "Nada mudou — não há o que comitar." | tee -a commit.log
            exit 0
          fi
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add "$ARQ"
          git commit -m "benchmarks: $(date -u +%Y-%m)"
          git push
          echo "Comitado e publicado — o Netlify republica sozinho." | tee -a commit.log

      # Põe tudo na primeira tela do run, para não precisar cavar o log.
      - name: Mostrar o resultado no resumo
        if: always()
        run: |
          {
            echo "# Resultado"
            echo
            echo "| Etapa | Como terminou |"
            echo "|---|---|"
            echo "| Busca dos índices | ${{ steps.busca.outcome }} |"
            echo "| Commit | ${{ steps.commit.outcome }} |"
            echo
            echo "## Busca"
            echo '```'
            if [ -f busca.log ]; then cat busca.log; else echo "(não rodou)"; fi
            echo '```'
            echo
            echo "## Commit"
            echo '```'
            if [ -f commit.log ]; then cat commit.log; else echo "(não rodou)"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Avisar se algum índice ficou sem dado
        if: steps.busca.outcome != 'success'
        run: |
          echo "::warning::Algum índice ficou sem valor. O motivo está no resumo deste run, logo acima."
